<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <pattern id="grid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="rgba(0, 217, 255, 0.2)" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background -->
  <rect width="64" height="64" fill="#1a1f2e"/>
  
  <!-- Grid pattern -->
  <rect width="64" height="64" fill="url(#grid)"/>
  
  <!-- Border frame with cut corners -->
  <path d="M 8 0 L 56 0 L 64 8 L 64 56 L 56 64 L 8 64 L 0 56 L 0 8 Z" 
        fill="none" 
        stroke="#00d9ff" 
        stroke-width="1.5" 
        filter="url(#glow)"/>
  
  <!-- Inner frame -->
  <path d="M 12 4 L 52 4 L 60 12 L 60 52 L 52 60 L 12 60 L 4 52 L 4 12 Z" 
        fill="none" 
        stroke="rgba(0, 217, 255, 0.3)" 
        stroke-width="0.5"/>
  
  <!-- Letter W -->
  <path d="M 18 22 L 24 46 L 32 30 L 40 46 L 46 22" 
        fill="none" 
        stroke="#00d9ff" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="miter"
        filter="url(#glow)"/>
  
  <!-- Corner accents -->
  <circle cx="8" cy="8" r="2" fill="#00d9ff" opacity="0.6"/>
  <circle cx="56" cy="8" r="2" fill="#00d9ff" opacity="0.6"/>
  <circle cx="8" cy="56" r="2" fill="#00d9ff" opacity="0.6"/>
  <circle cx="56" cy="56" r="2" fill="#00d9ff" opacity="0.6"/>
</svg>
